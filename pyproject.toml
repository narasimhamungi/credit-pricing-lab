[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-pricing-lab"
version = "0.1.0"
description = "Consumer-loan PD models (WoE scorecard vs gradient boosting) with out-of-time validation, expected loss, risk-based APR pricing and an approval / take-up funnel"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
creditlab = "creditlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
creditlab = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
