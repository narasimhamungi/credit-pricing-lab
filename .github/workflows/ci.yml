name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]" pyflakes
      - name: Lint
        run: python -m pyflakes src tests
      - name: Tests
        run: pytest -q
      - name: Synthetic end-to-end run
        run: creditlab run --synthetic --out /tmp/synthetic
